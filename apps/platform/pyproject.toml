# ODPlatform - platform 端配置 (hatchling backend)

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "od-platform"
dynamic = ["version"]
description = "ODPlatform - 目标检测开发平台核心引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XiaoLiang", email = "sx12101184@qq.com" }]
keywords = ["object-detection", "yolo", "deep-learning", "ml-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "colorlog>=6.10.1",
    "matplotlib>=3.8.0",
    "matplotx>=0.3.10",
    "pydantic>=2.0.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.0",
    "torch>=2.1.1",
    "ultralytics>=8.4.82",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
odp-init = "od_platform.cli.init_project:initialize_project"
odp-reset = "od_platform.cli.reset_project:main"
odp-transform = "od_platform.cli.transform_data:main"
odp-validate = "od_platform.cli.validate_data:main"
odp-gen-config = "od_platform.runtime_config.generator:main"
odp-train = "od_platform.cli.train_model:main"
odp-plot-training = "od_platform.cli.plot_training:main"
odp-import-dataset = "od_platform.cli.import_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/od_platform"]

[tool.hatch.version]
path = "src/od_platform/_version.py"
